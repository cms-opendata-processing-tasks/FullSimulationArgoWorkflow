apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: simulation-process-
spec:
  entrypoint: cms-full-sim
  serviceAccountName: argo-service-account
  volumes:
    - name: volume1
      persistentVolumeClaim:
        claimName: pvc-1
    - name: volume2
      persistentVolumeClaim:
        claimName: pvc-2
            
  arguments:
    parameters:
      ### EDIT BELOW: replace the placeholder 'yourstorage' with the name of your object storage
      - name: bucket
        value: mirastorage
      - name: dataName
        value: "lhe-testing"
      ### EDIT BELOW: replace the placeholder 'fragments.py' with the file name of your fragment
      - name: inputFileName
        value: "fragment.py"
      ### EDIT BELOW: if you are using the LHE format in event generation, give the name of your input gridpack file
      - name: gridpackName
        value: "gridpack.tar.xz"
      ### EDIT BELOW: replace the placeholder '10' with the amount of events you want to process
      - name: totEvents
        value: 10
      - name: jobsPerNode
        value: 1 # The workflow has been tested with nodes that only fit 2 jobs per node
      ### EDIT BELOW: replace the placeholder '2' with the number of nodes in your cluster
      - name: nNodes
        value: 2
      ### EDIT BELOW: replace the placeholder '2016' with the year of the run you are simulating
      - name: runYear
        value: "2016"
      ### EDIT BELOW: If you have already completed the LHE GEN step change the boolean to true
      - name: useLHE
        value: true

  templates:
    - name: cms-full-sim
      inputs:
        parameters:
          - name: bucket
          - name: dataName
          - name: inputFileName
          - name: gridpackName
          - name: totEvents
          - name: jobsPerNode
          - name: runYear
          - name: useLHE
          - name: nNodes

      steps:
        - - name: divide-jobs
            template: divide-jobs-template
            arguments:
              parameters:
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: totEvents
                  value: "{{inputs.parameters.totEvents}}"
                - name: jobsPerNode
                  value: "{{inputs.parameters.jobsPerNode}}"
                - name: nNodes
                  value: "{{inputs.parameters.nNodes}}"

        - - name: define-parameters
            template: define-parameters-template
            arguments:
              parameters:
                - name: runYear
                  value: "{{inputs.parameters.runYear}}"

        - - name: start-process-on-node
            template: start-process-on-node-template
            arguments:
              parameters:
              - name: bucket
                value: "{{inputs.parameters.bucket}}"
              - name: dataName
                value: "{{inputs.parameters.dataName}}"
              - name: inputFileName
                value: "{{inputs.parameters.inputFileName}}"
              - name: gridpackName
                value: "{{inputs.parameters.gridpackName}}"
              - name: nodeIndex
                value: "{{item.nodeIndex}}"
              - name: conditionsGenSimReco
                value: "{{steps.define-parameters.outputs.parameters.conditionsGenSimReco}}"
              - name: conditionsDigiPatNano
                value: "{{steps.define-parameters.outputs.parameters.conditionsDigiPatNano}}"
              - name: conditionsHLT
                value: "{{steps.define-parameters.outputs.parameters.conditionsHLT}}"
              - name: beamspot
                value: "{{steps.define-parameters.outputs.parameters.beamspot}}"
              - name: useLHE
                value: "{{inputs.parameters.useLHE}}"
              - name: jobList
                value: "{{item.jobList}}"
            withParam: "{{steps.divide-jobs.outputs.result}}"

        - - name: merge-result-files
            template: merge-result-files-template
            arguments:
              parameters:
              - name: bucket
                value: "{{inputs.parameters.bucket}}"
              - name: dataName
                value: "{{inputs.parameters.dataName}}"
              - name: nNodes
                value: "{{inputs.parameters.nNodes}}"
              - name: jobsPerNode
                value: "{{inputs.parameters.jobsPerNode}}"

        - - name: example-plots
            template: example-plots-template
            arguments:
              parameters:
              - name: bucket
                value: "{{inputs.parameters.bucket}}"
              - name: dataName
                value: "{{inputs.parameters.dataName}}"  

                
    - name: start-process-on-node-template
      inputs:
        parameters:
          - name: bucket
          - name: dataName
          - name: inputFileName
          - name: gridpackName
          - name: nodeIndex
          - name: conditionsGenSimReco
          - name: conditionsDigiPatNano
          - name: conditionsHLT
          - name: beamspot
          - name: useLHE
          - name: jobList

      steps:
        # - - name: pull-cmssw10-image
        #     template: pull-cmssw10-image-template

        # - - name: pull-cmssw8-image
        #     template: pull-cmssw8-image-template

        - - name: run-process-job
            template: run-process-job-template
            arguments:
              parameters:
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: inputFileName
                  value: "{{inputs.parameters.inputFileName}}"
                - name: gridpackName
                  value: "{{inputs.parameters.gridpackName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{item.jobIndex}}"
                - name: eventsInJob
                  value: "{{item.eventsInJob}}"
                - name: conditionsGenSimReco
                  value: "{{inputs.parameters.conditionsGenSimReco}}"
                - name: conditionsDigiPatNano
                  value: "{{inputs.parameters.conditionsDigiPatNano}}"
                - name: conditionsHLT
                  value: "{{inputs.parameters.conditionsHLT}}"
                - name: beamspot
                  value: "{{inputs.parameters.beamspot}}"
                - name: useLHE
                  value: "{{inputs.parameters.useLHE}}"
            withParam: "{{inputs.parameters.jobList}}"

    - name: run-process-job-template
      retryStrategy:
        limit: "3"
      inputs:
        parameters:
          - name: bucket
          - name: dataName
          - name: inputFileName
          - name: gridpackName
          - name: nodeIndex
          - name: jobIndex
          - name: eventsInJob
          - name: conditionsGenSimReco
          - name: conditionsDigiPatNano
          - name: conditionsHLT
          - name: beamspot
          - name: useLHE

      steps:
        - - name: lhe-gen
            template: lhe-gen-template
            when: "{{inputs.parameters.useLHE}} == true"
            arguments:
              parameters:
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: inputFileName
                  value: "{{inputs.parameters.inputFileName}}"
                - name: gridpackName
                  value: "{{inputs.parameters.gridpackName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsGenSimReco
                  value: "{{inputs.parameters.conditionsGenSimReco}}"
                - name: beamspot
                  value: "{{inputs.parameters.beamspot}}"

        - - name: gen
            template: gen-template
            when: "{{inputs.parameters.useLHE}} == false"
            arguments:
              parameters:
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: inputFileName
                  value: "{{inputs.parameters.inputFileName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsGenSimReco
                  value: "{{inputs.parameters.conditionsGenSimReco}}"
                - name: beamspot
                  value: "{{inputs.parameters.beamspot}}"

        - - name: sim
            template: sim-template
            arguments:
              parameters:
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsGenSimReco
                  value: "{{inputs.parameters.conditionsGenSimReco}}"
                - name: beamspot
                  value: "{{inputs.parameters.beamspot}}"

        - - name: pre-digi2raw
            template: pre-digi2raw-template
            arguments:
              parameters:
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"

        - - name: digi2raw
            template: digi2raw-template
            arguments:
              parameters:
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsDigiPatNano
                  value: "{{inputs.parameters.conditionsDigiPatNano}}"

        - - name: hlt
            template: hlt-template
            arguments:
              parameters:
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsHLT
                  value: "{{inputs.parameters.conditionsHLT}}"

        - - name: reco
            template: reco-template
            arguments:
              parameters:
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsGenSimReco
                  value: "{{inputs.parameters.conditionsGenSimReco}}"

        - - name: pat
            template: pat-template
            arguments:
              parameters:  
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsDigiPatNano
                  value: "{{inputs.parameters.conditionsDigiPatNano}}"

        - - name: nano
            template: nano-template
            arguments:
              parameters:
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: dataName
                  value: "{{inputs.parameters.dataName}}"
                - name: nodeIndex
                  value: "{{inputs.parameters.nodeIndex}}"
                - name: jobIndex
                  value: "{{inputs.parameters.jobIndex}}"
                - name: eventsInJob
                  value: "{{inputs.parameters.eventsInJob}}"
                - name: conditionsDigiPatNano
                  value: "{{inputs.parameters.conditionsDigiPatNano}}"

    - name: pull-cmssw10-image-template
      initContainers:
        - name: pull-cmssw10
          image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker-opendata/cmssw_10_6_30-slc7_amd64_gcc700
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "echo CMSSW10 pulled"]
        
      script:
        image: alpine:latest
        command: [sh]
        source: |
          echo "CMSSW images pulled and cached on this node."
          exit 0
        resources:
          requests:
            cpu:  "3"

    - name: divide-jobs-template
      inputs:
        parameters:
          - name: totEvents
          - name: jobsPerNode
          - name: nNodes
      script:
        image: python:alpine3.6
        command: [python]
        source: |
          # This script divides the amount of events processed evenly among nodes and the parallel jobs inside them
          # The result will be a list of jobs per node
          # dictlist = [
          #     {"nodeIndex": 1,
          #      "jobList": [
          #          {"jobIndex": 1, "eventsInJob": 10},
          #          {"jobIndex": 2, "eventsInJob": 10}
          #      ]
          #     },
          #     {"nodeIndex": 2,
          #          "jobList": [
          #              {"jobIndex": 1, "eventsInJob": 10},
          #              {"jobIndex": 2, "eventsInJob": 11}
          #          ]
          #         },
          # ]

          import json
          import sys

          nNodes = {{inputs.parameters.nNodes}}
          totEvents = {{inputs.parameters.totEvents}}
          jobsPerNode = {{inputs.parameters.jobsPerNode}} 
          nJobs = jobsPerNode * nNodes

          if totEvents <= 0:
              raise ValueError("Amount of events processed should be greater than zero")

          nodeList = [i for i in range(1, nNodes+1)]
          dictlist = []
          
          for i in nodeList:
              joblist = []
                  
              for j in range(1, jobsPerNode+1):
                  eventsInJobEven = int(totEvents/nJobs)
                  modEventsInJob = totEvents % nJobs

                  # Try to add the modulus of the division to the first job, but if it goes over 1600 leave it and divide again next iteration
                  eventsInJob = eventsInJobEven + modEventsInJob if eventsInJobEven + modEventsInJob <= 1600 else 1600

                  jobItem = { "jobIndex": j,
                      "eventsInJob": eventsInJob}
                  
                  joblist.append(jobItem)

                  # Substract the amount of events bound to this job, so that the modulus is different next time
                  totEvents -= eventsInJob
                  nJobs -= 1


              nodeItem = {"nodeIndex": i, "jobList": joblist}
              dictlist.append(nodeItem)

          json.dump(dictlist, sys.stdout)

    - name: define-parameters-template
      inputs:
        parameters:
          - name: runYear
      outputs:
        parameters:
          - name: conditionsGenSimReco
            valueFrom:
              path: /tmp/params/conditionsGenSimReco
          - name: conditionsDigiPatNano
            valueFrom:
              path: /tmp/params/conditionsDigiPatNano
          - name: conditionsHLT
            valueFrom:
              path: /tmp/params/conditionsHLT
          - name: beamspot
            valueFrom:
              path: /tmp/params/beamspot

      script:
        image: python:3.11-slim
        command: [python]
        source: |
          import json, os

          ALL_CONDS = {"2016": {"conditionsGenSimReco": "106X_mcRun2_asymptotic_v13", "conditionsDigiPatNano": "106X_mcRun2_asymptotic_v17", "conditionsHLT": "80X_mcRun2_asymptotic_2016_TrancheIV_v6", "beamspot": "Realistic25ns13TeV2016Collision"},
            "2015": {"conditionsGenSimReco": "106X_mcRun2_asymptotic_v13", "conditionsDigiPatNano": "106X_mcRun2_asymptotic_v17", "conditionsHLT": "80X_mcRun2_asymptotic_2016_TrancheIV_v6", "beamspot": "Realistic25ns13TeV2016Collision"}
            # Add other years here
          }
          # To-do: 2015 is only a mock runYear in ALL_CONDS, check what are the conds for that year for real

          SELECTED_CONDS = ALL_CONDS.get("{{inputs.parameters.runYear}}")

          if not SELECTED_CONDS:
            raise ValueError(f"Unknown runYear {'{{inputs.parameters.runYear}}'}, please add conditions for this runYear in the step define-parameters")

          os.makedirs("/tmp/params", exist_ok=True)

          for key, value in SELECTED_CONDS.items():
            with open(f"/tmp/params/{key}", "w") as tmp_file:
              tmp_file.write(str(value))

    - name: lhe-gen-template
      retryStrategy:
        limit: "3"
      inputs:
        parameters:
          - name: bucket
          - name: dataName
          - name: inputFileName
          - name: gridpackName
          - name: jobIndex
          - name: eventsInJob
          - name: conditionsGenSimReco
          - name: beamspot
          - name: nodeIndex
        
        artifacts:
          - name: input-files
            path: /code/CMSSW_10_6_30/src/Configuration/GenProduction/python # fix the path to better
            archive:
              none: {}
            s3:
              endpoint: s3.pub1.infomaniak.cloud
              bucket: "{{inputs.parameters.bucket}}"
              region: us-east-1 # placeholder, To-do
              accessKeySecret:
                name: s3-credentials
                key: S3_ACCESS_KEY_ID
              secretKeySecret:
                name: s3-credentials
                key: S3_SECRET_ACCESS_KEY
              insecure: false
              key: FullSim/{{inputs.parameters.dataName}}/input # path where it stays in the cloud storage
      
      script:
        image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker-opendata/cmssw_10_6_30-slc7_amd64_gcc700
        command: [bash]
        volumeMounts:
          - name: volume{{inputs.parameters.nodeIndex}}
            mountPath: /data
        source: |
          # Init first with sudo and then cmsusr
          echo "Initializing cmsenv"
          sudo --preserve-env=CMS_INSTALL_DIR,CMSSW_VERSION,SCRAM_ARCH /opt/cms/entrypoint.sh
          source /opt/cms/entrypoint.sh

          cd /code/CMSSW_10_6_30/src/

          echo "Changing ownership"
          sudo chown -R cmsusr:cmsusr /data
          sudo chown -R cmsusr:cmsusr /code/CMSSW_10_6_30
          echo "Now in" $(pwd)


          mkdir -p Configuration/GenProduction/python

          # Move the gridpack to the working directory
          mv Configuration/GenProduction/python/{{inputs.parameters.gridpackName}} .
          
          scram b

          # Make a dir where all the different jobs store the .root output files from this step
          # --> this dir is mounted in the cloud storage

          mkdir -p /data/GEN

          PYTHON_FILENAME=/data/GEN/GEN{{inputs.parameters.jobIndex}}_cfg.py
          OUTPUT_FILE=/data/GEN/GEN_node{{inputs.parameters.nodeIndex}}_job{{inputs.parameters.jobIndex}}.root
          EVENTS={{inputs.parameters.eventsInJob}}

          CONDITIONS={{inputs.parameters.conditionsGenSimReco}} # 106X_mcRun2_asymptotic_v13
          BEAMSPOT={{inputs.parameters.beamspot}} # Realistic25ns13TeV2016Collision
          
          cmsDriver.py Configuration/GenProduction/python/{{inputs.parameters.inputFileName}} --python_filename $PYTHON_FILENAME --eventcontent RAWSIM,LHE \
          --customise Configuration/DataProcessing/Utils.addMonitoring --datatier GEN,LHE --fileout file:$OUTPUT_FILE \
          --conditions $CONDITIONS --beamspot $BEAMSPOT \
          --customise_commands process.source.numberEventsInLuminosityBlock="cms.untracked.uint32(100)" --step LHE,GEN \
          --geometry DB:Extended --era Run2_2016 --no_exec --mc -n $EVENTS

          # To-do: find out what to do with the numberEventsInLuminosityBlock ^
          # some datasets have it 100, some have it 2500 or something

          # To-do: Do all LHE GEN need this LHAPDF file, or something else --> figure out a way to extract the necessary LHAPDF from config like in regular GEN       
          LHAPDF_SET_NAME="NNPDF31_nnlo_as_0118_nf_4_mc_hessian"

          # cd to the LHAPDF dir
          cd $LHAPDF_DATA_PATH
          # Remove other mentions of this dataset
          sudo rm -fr $LHAPDF_SET_NAME

          echo "in $LHAPDF_DATA_PATH"

          echo "LHAPDF_SET_NAME" $LHAPDF_SET_NAME
          echo "installing..."
          sudo wget -q 'https://lhapdfsets.web.cern.ch/current/'"${LHAPDF_SET_NAME}"'.tar.gz'
          sudo tar xf "$LHAPDF_SET_NAME"'.tar.gz'
          sudo chown -R cmsinst:cmsinst .
          sudo rm -r "$LHAPDF_SET_NAME"'.tar.gz'

          LHAPDF_SET_NAME="NNPDF31_nnlo_as_0118"

          # Remove other mentions of this dataset
          sudo rm -fr $LHAPDF_SET_NAME

          echo "LHAPDF_SET_NAME" $LHAPDF_SET_NAME
          echo "installing..."
          sudo wget -q 'https://lhapdfsets.web.cern.ch/current/'"${LHAPDF_SET_NAME}"'.tar.gz'
          sudo tar xf "$LHAPDF_SET_NAME"'.tar.gz'
          sudo chown -R cmsinst:cmsinst .
          sudo rm -r "$LHAPDF_SET_NAME"'.tar.gz'

          echo "Finished LHAPDF installation"
          

          cd /code/CMSSW_10_6_30/src/


          cmsRun $PYTHON_FILENAME
    

    - name: gen-template
      retryStrategy:
        limit: "3"
      inputs:
        parameters:
          - name: bucket
          - name: dataName
          - name: inputFileName
          - name: jobIndex
          - name: eventsInJob
          - name: conditionsGenSimReco
          - name: beamspot
          - name: nodeIndex
        
        artifacts:
          - name: input-fragment
            path: /code/CMSSW_10_6_30/src/Configuration/GenProduction/python/fragments.py # path for file in container
            archive:
              none: {}
            s3:
              endpoint: s3.pub1.infomaniak.cloud
              bucket: "{{inputs.parameters.bucket}}"
              region: us-east-1 # placeholder, To-do
              accessKeySecret:
                name: s3-credentials
                key: S3_ACCESS_KEY_ID
              secretKeySecret:
                name: s3-credentials
                key: S3_SECRET_ACCESS_KEY
              insecure: false
              key: FullSim/{{inputs.parameters.dataName}}/input/{{inputs.parameters.inputFileName}} # path where it stays in the cloud storage
      
      script:
        image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker-opendata/cmssw_10_6_30-slc7_amd64_gcc700
        command: [bash]
        volumeMounts:
          - name: volume{{inputs.parameters.nodeIndex}}
            mountPath: /data
        source: |
          # Init first with sudo and then cmsusr
          echo "Initializing cmsenv"
          sudo --preserve-env=CMS_INSTALL_DIR,CMSSW_VERSION,SCRAM_ARCH /opt/cms/entrypoint.sh
          source /opt/cms/entrypoint.sh

          cd /code/CMSSW_10_6_30/src/

          echo "Changing ownership"
          sudo chown -R cmsusr:cmsusr /data
          sudo chown -R cmsusr:cmsusr /code/CMSSW_10_6_30
          echo "Now in" $(pwd)


          mkdir -p Configuration/GenProduction/python
          
          scram b

          # Make a dir where all the different jobs store the .root output files from this step
          # --> this dir is mounted in the cloud storage

          mkdir -p /data/GEN

          PYTHON_FILENAME=/data/GEN/GEN{{inputs.parameters.jobIndex}}_cfg.py
          OUTPUT_FILE=/data/GEN/GEN_node{{inputs.parameters.nodeIndex}}_job{{inputs.parameters.jobIndex}}.root
          EVENTS={{inputs.parameters.eventsInJob}}

          CONDITIONS={{inputs.parameters.conditionsGenSimReco}} # 106X_mcRun2_asymptotic_v13
          BEAMSPOT={{inputs.parameters.beamspot}} # Realistic25ns13TeV2016Collision
          
          cmsDriver.py Configuration/GenProduction/python/fragments.py --python_filename $PYTHON_FILENAME --eventcontent RAWSIM \
          --customise Configuration/DataProcessing/Utils.addMonitoring --datatier GEN --fileout file:$OUTPUT_FILE \
          --conditions $CONDITIONS --beamspot $BEAMSPOT \
          --customise_commands process.source.numberEventsInLuminosityBlock="cms.untracked.uint32(100)" --step GEN \
          --geometry DB:Extended --era Run2_2016 --no_exec --mc -n $EVENTS

          # To-do: find out what to do with the numberEventsInLuminosityBlock ^
          # some datasets have it 100, some have it 2500 or something

          # In the generated python file, find which LHAPDF set is needed

          # To-do: now the script just takes the first LHAPDF set of the ones mentioned in the config. In the future, make a for loop and go through all datasets and install them all
          # Thusfar no dataset has needed multiple LHAPDF sets so this has not been necessary

          # Grep all the mentions of LHAPDF in the configuration file
          LHAPDF_MENTIONS="$(grep -oP "PDF:pSet=LHAPDF6:\K.*?(?=')" $PYTHON_FILENAME)"

          # Take the first word of those results       
          LHAPDF_SET_NAME=$(echo $LHAPDF_MENTIONS| cut -d' ' -f 2)

          # cd to the LHAPDF dir
          cd $LHAPDF_DATA_PATH
          # Remove other mentions of this dataset
          sudo rm -fr $LHAPDF_SET_NAME

          echo "in $LHAPDF_DATA_PATH"

          # If the configuration contained mentions of LHAPDF, start installation
          if [[ $LHAPDF_SET_NAME != "" ]]; then
            echo "LHAPDF_SET_NAME" $LHAPDF_SET_NAME
            sudo wget -q 'https://lhapdfsets.web.cern.ch/current/'"${LHAPDF_SET_NAME}"'.tar.gz'
            sudo tar xf "$LHAPDF_SET_NAME"'.tar.gz'
            sudo chown -R cmsinst:cmsinst .
            sudo rm -r "$LHAPDF_SET_NAME"'.tar.gz'

            echo "Did LHAPDF installation"
          else
            echo "No LHAPDF defined in the configuration, skipping LHAPDF installation."
          fi

          cd /code/CMSSW_10_6_30/src/


          cmsRun $PYTHON_FILENAME
          
        resources:
          requests:
            cpu: "700m"
            memory: "2Gi"

    - name: sim-template
      retryStrategy:
        limit: "3"
      inputs:
        parameters:
          - name: dataName
          - name: jobIndex
          - name: eventsInJob
          - name: conditionsGenSimReco
          - name: beamspot
          - name: nodeIndex

      script:
        image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker-opendata/cmssw_10_6_30-slc7_amd64_gcc700
        command: [bash]
        volumeMounts:
          - name: volume{{inputs.parameters.nodeIndex}}
            mountPath: /data
        source: |
          # Init first with sudo and then cmsusr
          echo "Initializing cmsenv"
          sudo --preserve-env=CMS_INSTALL_DIR,CMSSW_VERSION,SCRAM_ARCH /opt/cms/entrypoint.sh
          source /opt/cms/entrypoint.sh

          cd /code/CMSSW_10_6_30/src

          echo "Changing ownership"
          sudo chown -R cmsusr:cmsusr /data
