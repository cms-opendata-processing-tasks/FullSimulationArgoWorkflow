    - name: merge-result-files-template
      inputs:
        parameters:
          - name: bucket
          - name: dataName
          - name: nNodes
          - name: jobsPerNode
      
      outputs:
        artifacts:
          - name: results
            path: /code/output
            archive:
              none: {}
            s3:
              endpoint: s3.pub1.infomaniak.cloud
              bucket: "{{inputs.parameters.bucket}}"
              region: us-east-1
              accessKeySecret:
                name: s3-credentials
                key: S3_ACCESS_KEY_ID
              secretKeySecret:
                name: s3-credentials
                key: S3_SECRET_ACCESS_KEY
              insecure: false
              key: FullSim/{{inputs.parameters.dataName}}/results
      
      script:
        image: gitlab-registry.cern.ch/cms-cloud/root-vnc:latest
        command: [bash]
        volumeMounts:
          - name: volume1
            mountPath: /data/1
          - name: volume2
            mountPath: /data/2

        source: |
          mkdir -p /code/output /data/1 /data/2

          # First get one file to get an idea of the file size before merge
          FILENAME="/data/1/NANO/NANO_node1_job1.root"
          FILESIZE=$(stat -c%s "$FILENAME") # in bytes

          JOBS_PER_NODE={{inputs.parameters.jobsPerNode}}
          N_JOBS=$(( {{inputs.parameters.nNodes}} * $JOBS_PER_NODE ))

          OUTPUT_FILESIZE=2000000000 # 2GB is the target size

          INPUT_FILES_IN_OUTPUT=$(($OUTPUT_FILESIZE / $FILESIZE))

          if [[ $INPUT_FILES_IN_OUTPUT -ge $N_JOBS ]] ; then
            INPUT_FILES_IN_OUTPUT=$N_JOBS
          fi

          N_OF_OUTPUT_FILES=$(($N_JOBS/$INPUT_FILES_IN_OUTPUT))

          if [[ $(($N_JOBS % $INPUT_FILES_IN_OUTPUT)) != 0 ]]; then
            ((  N_OF_OUTPUT_FILES+=1 ))
          fi

          for i in $(seq 1 $((N_OF_OUTPUT_FILES)))
          do
            START=$(($i))
            END=$(($START+$INPUT_FILES_IN_OUTPUT-1))
            if [[ $END != $N_JOBS ]] ; then
              LIST_OF_INDECES=($(seq $START $END))
            else
              LIST_OF_INDECES=($(seq $START $N_JOBS))
            fi

            FILENAMES_STRING=""
            VOLUME_NUM=0
            job=1

            for j in $(seq 1 $(($N_JOBS)))
            do
              # Move from mount to another if the job index goes over the JOBS_PER_NODE.
              # e.g. job number 3 is on volume 2 so the dir path should be changed to /data/2/NANO from /data/1/NANO
              if [[ $(($job % $JOBS_PER_NODE)) == 1 || $JOBS_PER_NODE == 1]] ; then
                (( VOLUME_NUM+=1 ))
                job=1
              fi
              FILENAMES_STRING+="/data/$VOLUME_NUM/NANO/NANO_node${VOLUME_NUM}_job${LIST_OF_INDECES[job-1]}.root "
              (( job+=1 ))
            done
            
            hadd -f /code/output/output_$i.root $FILENAMES_STRING

          done

    - name: example-plots-template
      inputs:
        parameters:
          - name: bucket
          - name: dataName

        artifacts:
          - name: results
            path: /output
            archive:
              none: {}
            s3:
              endpoint: s3.pub1.infomaniak.cloud
              bucket: "{{inputs.parameters.bucket}}"
              region: us-east-1
              accessKeySecret:
                name: s3-credentials
                key: S3_ACCESS_KEY_ID
              secretKeySecret:
                name: s3-credentials
                key: S3_SECRET_ACCESS_KEY
              insecure: false
              key: FullSim/{{inputs.parameters.dataName}}/results

      outputs:
        artifacts:
          - name: plots
            path: /output/plots
            archive:
              none: {}
            s3:
              endpoint: s3.pub1.infomaniak.cloud
              bucket: "{{inputs.parameters.bucket}}"
              region: us-east-1
              accessKeySecret:
                name: s3-credentials
                key: S3_ACCESS_KEY_ID
              secretKeySecret:
                name: s3-credentials
                key: S3_SECRET_ACCESS_KEY
              insecure: false
              key: FullSim/{{inputs.parameters.dataName}}/plots

      script:
        image: python:3.11-slim
        command: [bash]
        source: |
          set -e

          pip install --no-cache-dir uproot awkward vector matplotlib

          cd /output
          mkdir -p plots

          cat > analyse.py << 'EOPY'
          import uproot
          import awkward as ak
          import vector
          import matplotlib.pyplot as plt
          import numpy as np

          vector.register_awkward()
          input_file = "output_1.root"
          print(f"Loading {input_file}...")

          with uproot.open(input_file) as f:
              tree = f["Events"]
              nElectrons = tree["nElectron"].array()
              pdgId = tree["Electron_pdgId"].array()
              pt = tree["Electron_pt"].array()
              eta = tree["Electron_eta"].array()
              phi = tree["Electron_phi"].array()
              mass = tree["Electron_mass"].array()

              print(f"Loaded {len(nElectrons)} events.")

              nElectrons_np = ak.to_numpy(nElectrons)
              print(f"nElectrons stats: min={nElectrons_np.min()}, max={nElectrons_np.max()}")

              plt.figure(figsize=(8, 5))
              plt.hist(nElectrons_np, bins=120, histtype='step', linewidth=2)
              plt.title("Number of Electrons per Event")
              plt.xlabel("nElectrons")
              plt.ylabel("Events")
              plt.grid(True, alpha=0.3)
              plt.savefig("plots/h_num_cands.png")
              plt.close()

              plt.figure(figsize=(8, 5))
              all_pdg = ak.flatten(pdgId)
              plt.hist(ak.to_numpy(all_pdg), bins=range(-20, 20), histtype='step', linewidth=2)
              plt.title("Type of Electrons (PDG ID)")
              plt.xlabel("PDG ID")
              plt.ylabel("Counts")
              plt.grid(True, alpha=0.3)
              plt.savefig("plots/h_pdgid_cands.png")
              plt.close()

              particles = vector.zip({"pt": pt, "eta": eta, "phi": phi, "mass": mass})
              mu_mask = ((pdgId == 13) | (pdgId == -13)) & (pt > 2.0)
              el_mask = ((pdgId == 11) | (pdgId == -11)) & (pt > 2.0)

              mu_vec = particles[mu_mask]
              mu_id = pdgId[mu_mask]
              el_vec = particles[el_mask]
              el_id = pdgId[el_mask]

              mu_pairs = ak.combinations(mu_vec, 2)
              mu_id_pairs = ak.combinations(mu_id, 2)
              p1_mu, p2_mu = mu_pairs["0"], mu_pairs["1"]
              id1_mu, id2_mu = mu_id_pairs["0"], mu_id_pairs["1"]
              os_mu = (id1_mu * id2_mu) < 0
              dimuon_mass = (p1_mu + p2_mu)[os_mu].mass

              el_pairs = ak.combinations(el_vec, 2)
              el_id_pairs = ak.combinations(el_id, 2)
              p1_el, p2_el = el_pairs["0"], el_pairs["1"]
              id1_el, id2_el = el_id_pairs["0"], el_id_pairs["1"]
              os_el = (id1_el * id2_el) < 0
              dielectron_mass = (p1_el + p2_el)[os_el].mass

              plt.figure(figsize=(8, 6))
              dimuon_flat = ak.flatten(dimuon_mass)
              if len(dimuon_flat) > 0:
                  plt.hist(ak.to_numpy(dimuon_flat), bins=120, range=(0, 120), histtype='step', color='blue', linewidth=2)
              plt.title("Dimuon Invariant Mass")
              plt.xlabel("M_{mumu} (GeV)")
              plt.ylabel("Events")
              plt.grid(True, alpha=0.3)
              plt.savefig("plots/h_dimuon_mass.png")
              plt.close()

              plt.figure(figsize=(8, 6))
              dielectron_flat = ak.flatten(dielectron_mass)
              if len(dielectron_flat) > 0:
                  plt.hist(ak.to_numpy(dielectron_flat), bins=120, range=(0, 120), histtype='step', color='red', linewidth=2)
              plt.title("Dielectron Invariant Mass")
              plt.xlabel("M_{ee} (GeV)")
              plt.ylabel("Events")
              plt.grid(True, alpha=0.3)
              plt.savefig("plots/h_dielectron_mass.png")
              plt.close()
              print("Analysis complete.")
          EOPY

          python3 analyse.py
          ls -l /output/plots
