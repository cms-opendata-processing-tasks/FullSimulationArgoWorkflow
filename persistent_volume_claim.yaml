apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-1
  namespace: argo
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
  volumeName: pv-1

